image:
  repository: registry.re8ch.com/platform/regional-routing-authority
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

# Explicit opt-in prevents an unconfigured release from binding DNS port 53 on
# every cluster node.
enabled: false

crd:
  install: true

nameservers: []
authorityNodes: {}
services: {}
publicEdges: []

workload:
  hostNetwork: true
  priorityClassName: ""
  tolerations: []

probe:
  connectTimeoutSeconds: 5
  responseTimeoutSeconds: 12

publication:
  enabled: false
  publisherNode: ""
  refs: {}

rbac:
  mutateIngresses: false

service:
  type: ClusterIP
  annotations: {}
  externalTrafficPolicy: ""

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {cpu: 250m, memory: 128Mi}
